name: AIHOT 热点与模型榜

# 独立于主采集：只搬 AIHOT 外部数据快照 + 刷新页面与 feed。
# 主采集负责全量 RSS + AI 分析；本 workflow 只抓热点/模型榜两个外部榜单，
# 避免轻量任务绑定在沉重管线上互相拖累。

# 防止重复并发：新的 scheduled run 启动时，取消还在跑的旧 run
concurrency:
  group: aihot-data
  cancel-in-progress: true

on:
  # 北京时间 08:00 / 20:00（GitHub Actions schedule 用 UTC，北京 = UTC+8）
  # 与主采集（北京 02:00 / 09:00）错开，降低同时 push 撞车概率
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 12 * * *'
  # 手动触发
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - html-only

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # AIHOT 热点：按天归档到 data/aihot_hot/YYYY-MM-DD.json + 更新当前快照
      - name: Fetch AIHOT hot topics
        run: python scripts/fetch_aihot_hot.py || echo "⚠️ AIHOT 热点抓取失败，本次跳过"

      # AIHOT 模型榜：救活此前停更的手动榜
      - name: Fetch AIHOT model leaderboard
        run: python scripts/fetch_model_leaderboard.py || echo "⚠️ AIHOT 模型榜抓取失败，本次跳过"

      # 刷新页面：AIHOT 数据变化要反映到静态 HTML，必须重新生成。
      # 传 key 供周报/月报 AI 编辑层使用；失败不阻断（数据已落盘，页面由下一次生成刷新）。
      - name: Generate HTML
        run: python scripts/generate_html.py --force || echo "⚠️ 页面生成失败，数据已保存，待下次刷新"
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY }}

      - name: Generate RSS feed
        run: python generate_feed.py || echo "⚠️ RSS 生成失败，本次跳过"

      # 自动提交：fetch + rebase 后 push，撞上主采集时自动合并，不自毁
      - name: Auto-commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "AIHOT 数据更新 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
          file_pattern: 'data/aihot_hot.json data/aihot_hot/ data/model_leaderboard.json docs/'
